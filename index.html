<title>СКАНВОРЛД</title>
<style>
:root{--paper:#f3f0e8;--sheet:#faf8f2;--ink:#111;--muted:#77736b;--rule:#aaa79f;--clue:#dedbd3;--blue:#1478ff;--blue-soft:#dceaff;--bad:#c8332d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;overscroll-behavior:none;touch-action:none;user-select:none}
button{font:inherit}canvas{display:block;position:absolute;inset:0;touch-action:none}
#hud{position:absolute;z-index:5;left:0;right:0;top:0;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:14px;background:rgba(243,240,232,.97);border-bottom:2px solid var(--ink)}
.logo{font:700 19px Georgia,serif;letter-spacing:-.03em}.logo span{color:var(--blue)}
.spacer{flex:1}.stat{display:flex;gap:4px;align-items:baseline}.stat small{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.btn{height:34px;padding:0 11px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
#sheet{position:absolute;z-index:6;left:0;right:0;bottom:0;background:var(--sheet);border-top:2px solid var(--ink);padding:15px 12px calc(10px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease}
#sheet.open{transform:translateY(0)}#sheet.shake{animation:shake .28s}@keyframes shake{25%{transform:translate(-5px)}50%{transform:translate(5px)}75%{transform:translate(-3px)}}
.qrow{display:flex;gap:10px;align-items:flex-start}.qtext{font:700 22px/1.08 Georgia,serif;flex:1}.close{border:0;background:none;font-size:28px;color:var(--muted);padding:0 3px}
.qmeta{margin-top:7px;color:var(--muted);font-size:10px;letter-spacing:.11em;text-transform:uppercase}
#slots{display:flex;justify-content:center;gap:6px;margin:16px 0;flex-wrap:wrap}.slot{width:38px;height:44px;display:grid;place-items:center;border:1px solid var(--rule);background:#fff;font:700 22px Georgia,serif}.slot.fixed{background:#e4e1d9;color:#67645d}.slot.cur{border:2px solid var(--blue);background:var(--blue-soft)}
#kb{display:flex;flex-direction:column;gap:6px}.krow{display:flex;gap:5px}.key{flex:1;min-width:0;height:42px;border:1px solid #c8c4bb;background:#fff;color:#111;border-radius:4px;box-shadow:0 1px 2px #0002;font-size:16px}.key:active{background:#e8e5de}.key.wide{flex:1.7;font-size:10px;letter-spacing:.05em}.key.hint{background:var(--blue-soft);border-color:var(--blue);color:#0758ba}
#toast{position:absolute;z-index:8;left:50%;top:42%;transform:translate(-50%,-50%);padding:9px 13px;background:var(--ink);color:#fff;font-weight:700;opacity:0;pointer-events:none}#toast.go{animation:toast .9s}@keyframes toast{20%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%)}}
#intro{position:absolute;z-index:10;inset:0;background:var(--paper);padding:calc(18px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.edition{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid;border-bottom:3px double;font:11px Georgia,serif;text-transform:uppercase}.mast{font:700 clamp(48px,16vw,92px)/.9 Georgia,serif;letter-spacing:-.065em;margin:19px 0 12px;border-bottom:5px solid;padding-bottom:15px}.mast span{color:var(--blue)}
.kicker{font-size:11px;letter-spacing:.18em;color:var(--blue);font-weight:700}.headline{margin:9px 0;font:700 clamp(35px,11vw,60px)/.9 Georgia,serif;letter-spacing:-.045em}.deck{font:italic 18px/1.3 Georgia,serif;border-bottom:1px solid;padding-bottom:15px}
.mini-grid{flex:1;min-height:120px;margin:14px 0;background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:42px 42px;position:relative;overflow:hidden}.mini-grid:after{content:"С К А Н В О Р Л Д";position:absolute;left:-1px;top:42px;height:42px;display:flex;align-items:center;padding:0 10px;font:700 22px Georgia,serif;word-spacing:15px;background:#fff;border:1px solid var(--rule);color:var(--ink)}
.start{height:52px;border:2px solid var(--ink);background:transparent;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.start:active{background:var(--ink);color:var(--paper)}
.note{display:flex;justify-content:space-between;margin-top:10px;font:10px Georgia,serif;color:var(--muted)}
@media(min-width:800px){#sheet{left:auto;width:440px;top:56px;border-top:0;border-left:2px solid;transform:translateX(105%)}#sheet.open{transform:none}.key{height:46px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function fixed(w,i){var p=cells(w)[i];return shownAt(p[0],p[1])}
function select(id){
 var w=words.find(function(v){return v.id===id});if(!w||w.solved)return;selected=w;buffer=[];for(var i=0;i<w.a.length;i++)buffer.push(fixed(w,i)||"");cursor=buffer.findIndex(function(v){return !v});if(cursor<0)cursor=0;

}

function renderSlots(){slots.innerHTML="";if(!selected)return;var sz=Math.min(38,Math.floor((innerWidth-35)/selected.a.length)-5);buffer.forEach(function(ch,i){var d=document.createElement("button");d.className="slot"+(fixed(selected,i)?" fixed":"")+(i===cursor?" cur":"");d.style.width=sz+"px";d.textContent=ch;d.onclick=function(){if(!fixed(selected,i)){cursor=i;renderSlots()}};slots.appendChild(d)})}
function type(ch){if(!selected)return;buffer[cursor]=ch;var n=cursor+1;while(n<buffer.length&&fixed(selected,n))n++;cursor=Math.min(n,buffer.length-1);renderSlots();if(buffer.every(Boolean))setTimeout(check,100)}
function back(){if(!selected)return;if(!buffer[cursor]||fixed(selected,cursor)){var n=cursor-1;while(n>=0&&fixed(selected,n))n--;if(n>=0)cursor=n}if(!fixed(selected,cursor))buffer[cursor]="";renderSlots()}
function hint(){if(!selected)return;if(coins<3){toastMsg("Не хватает монет");return}var free=[];for(var i=0;i<selected.a.length;i++)if(!fixed(selected,i)&&buffer[i]!==selected.a[i])free.push(i);if(!free.length)return;var n=free[Math.floor(Math.random()*free.length)],p=cells(selected)[n];localStorage.setItem("sv:"+KEY(p[0],p[1]),"1");buffer[n]=selected.a[n];coins-=3;hud();renderSlots();draw();save();if(buffer.every(Boolean))setTimeout(check,100)}
function adjacentNext(w){
 var ids=new Set();cells(w).forEach(function(p){var b=board.get(KEY(p[0],p[1]));if(b.h&&b.h!==w.id)ids.add(b.h);if(b.v&&b.v!==w.id)ids.add(b.v)});
 var candidates=Array.from(ids).map(function(id){return words.find(function(v){return v.id===id})}).filter(function(v){return v&&!v.solved});
 if(!candidates.length)candidates=words.filter(function(v){return !v.solved});
 candidates.sort(function(a,b){var aa=ids.has(a.id)?0:100+Math.abs(a.x-w.x)+Math.abs(a.y-w.y),bb=ids.has(b.id)?0:100+Math.abs(b.x-w.x)+Math.abs(b.y-w.y);if(aa!==bb)return aa-bb;return radius(b)-radius(a)});
 return candidates[0]||null
}
function check(){
 if(!selected)return;if(buffer.join("")!==selected.a){sheet.classList.remove("shake");void sheet.offsetWidth;sheet.classList.add("shake");for(var i=0;i<buffer.length;i++)if(!fixed(selected,i))buffer[i]="";cursor=buffer.findIndex(function(v){return !v});renderSlots();return}
 var done=selected;done.solved=true;score++;var gain=Math.max(2,done.a.length-2);coins+=gain;expand(done,3);toastMsg("Верно · +"+gain);hud();save();var next=adjacentNext(done);selected=null;draw();if(next)setTimeout(function(){select(next)},420);else sheet.classList.remove("open")
}

function load(){try{var d=JSON.parse(localStorage.getItem("skanvorld:v3"));if(!d||!d.words||!d.words.length)return false;words=[];board=new Map();clues=new Map();used=new Map();nextId=1;d.words.forEach(function(w){place(w.a,w.q,w.d,w.x,w.y,w.dir,w.solved)});coins=d.coins||12;score=d.score||1;cam=d.cam||{x:0,y:0};zoom=d.zoom||1;return true}catch(e){return false}}
var pointers=new Map(),moved=0,pinch=0,zoomStart=1;
cv.addEventListener("pointerdown",function(e){cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;if(pointers.size===2){var p=Array.from(pointers.values());pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);zoomStart=zoom}});
cv.addEventListener("pointermove",function(e){var p=pointers.get(e.pointerId);if(!p)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;if(pointers.size===2){var q=Array.from(pointers.values()),d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);zoom=Math.max(.58,Math.min(1.65,zoomStart*d/pinch));moved=99}else{cam.x-=dx;cam.y-=dy;moved+=Math.abs(dx)+Math.abs(dy)}draw()});
function pointerUp(e){pointers.delete(e.pointerId);if(moved<8)tap(e.clientX,e.clientY);save()}cv.addEventListener("pointerup",pointerUp);cv.addEventListener("pointercancel",function(e){pointers.delete(e.pointerId)});
